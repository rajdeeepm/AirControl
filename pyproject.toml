[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aircontrol"
version = "1.0.0"
description = "Local webcam hand gestures for desktop control on Windows and macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mediapipe==0.10.35",
  "opencv-contrib-python==5.0.0.93",
  "pywebview",
  "websockets",
  # macOS input injection goes through Quartz, and media keys through AppKit.
  # Markers keep a Windows install from paying for either.
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[project.scripts]
aircontrol = "aircontrol.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
