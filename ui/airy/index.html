<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ws://127.0.0.1:8787 ws://127.0.0.1:* ws://localhost:*; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airy · AirControl companion</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-rounded, "Segoe UI Variable", "Segoe UI", sans-serif;
        font-synthesis: none;
        --cyan: #57efff;
        --cyan-white: #d9fbff;
        --green: #75f0bb;
        --amber: #ffc568;
        --red: #ff6b6b;
        --purple: #b98cff;
        --muted: #91a4ad;
        --card: rgba(10, 19, 26, 0.82);
        --card-edge: rgba(226, 250, 255, 0.2);
        --motion-fast: 190ms;
        --motion-mid: 300ms;
        --motion-slow: 480ms;
        --motion-amplitude: 8px;
        --motion-amplitude-negative: -8px;
        --arm-motion-angle: 20deg;
        --arm-motion-counter-angle: -13deg;
        --effect-opacity: 0.85;
        --airy-scale: 1;
        --hold-progress: 0;
        --pupil-x: 0px;
        --pupil-y: 0px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: grid;
        padding: 4px;
        place-items: center;
      }

      body[data-feedback-level="hidden"] {
        pointer-events: none;
      }

      button {
        font: inherit;
      }

      .airy-card {
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        width: 100%;
        height: 100%;
        min-width: 170px;
        min-height: 198px;
        padding: 4px 8px 9px;
        overflow: hidden;
        border: 1px solid var(--card-edge);
        border-radius: 16px;
        color: #e9f5f8;
        background:
          radial-gradient(circle at 50% 13%, rgba(122, 239, 255, 0.11), transparent 43%),
          linear-gradient(155deg, rgba(32, 46, 56, 0.84), var(--card) 54%, rgba(5, 11, 15, 0.92));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          inset 0 -1px 0 rgba(0, 0, 0, 0.5),
          0 4px 8px rgba(1, 8, 12, 0.35);
        transition:
          border-color var(--motion-fast) ease-out,
          background var(--motion-fast) ease-out,
          opacity var(--motion-fast) ease-out;
      }

      .airy-card::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.07), transparent 27% 73%, rgba(87, 239, 255, 0.04));
        content: "";
        pointer-events: none;
      }

      .pywebview-drag-region {
        -webkit-app-region: drag;
      }

      .no-drag {
        -webkit-app-region: no-drag;
      }

      .drag-handle {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 7;
        width: calc(100% - 44px);
        height: 28px;
        cursor: grab;
      }

      .airy-card.js-drag-fallback,
      .airy-card.js-drag-fallback .pywebview-drag-region {
        -webkit-app-region: no-drag;
        cursor: grab;
      }

      .airy-card[data-dragging="true"] {
        cursor: grabbing;
      }

      .close-button {
        position: absolute;
        top: 7px;
        right: 7px;
        z-index: 12;
        display: grid;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: rgba(226, 241, 246, 0.76);
        background: rgba(3, 10, 14, 0.64);
        cursor: pointer;
        place-items: center;
        transition:
          color var(--motion-fast) ease-out,
          background var(--motion-fast) ease-out,
          transform var(--motion-fast) ease-out;
      }

      .close-button svg {
        width: 11px;
        height: 11px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 1.8;
      }

      .close-button:hover {
        color: #ffffff;
        background: rgba(52, 68, 76, 0.9);
        transform: scale(1.05);
      }

      .close-button:active {
        transform: scale(0.95);
      }

      .close-button:focus-visible,
      .companion-button:focus-visible,
      .menu-button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      .companion-button {
        position: relative;
        z-index: 2;
        display: grid;
        width: 100%;
        min-height: 0;
        padding: 5px 0 0;
        border: 0;
        border-radius: 12px;
        color: inherit;
        background: transparent;
        cursor: pointer;
        place-items: center;
        -webkit-tap-highlight-color: transparent;
      }

      .companion-button::after {
        position: absolute;
        inset: 12px 10px 2px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(87, 239, 255, 0.07), transparent 65%);
        content: "";
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--motion-fast) ease-out;
      }

      .companion-button:hover::after,
      .companion-button:focus-visible::after {
        opacity: 1;
      }

      .robot-stage {
        position: relative;
        display: grid;
        width: 160px;
        height: 139px;
        place-items: center;
      }

      .halo,
      .tracking-halo,
      .hold-ring,
      .execution-ring,
      .motion-trail,
      .sound-wave,
      .scroll-arrow {
        position: absolute;
        pointer-events: none;
      }

      .halo,
      .tracking-halo,
      .hold-ring,
      .execution-ring,
      .motion-trail,
      .sound-wave {
        left: 50%;
        border-radius: 50%;
      }

      .halo {
        top: 3px;
        width: 134px;
        height: 134px;
        border: 1px solid rgba(87, 239, 255, 0.32);
        background: radial-gradient(circle, rgba(87, 239, 255, 0.2), rgba(87, 239, 255, 0.06) 42%, transparent 68%);
        box-shadow:
          0 0 17px rgba(87, 239, 255, 0.24),
          inset 0 0 22px rgba(87, 239, 255, 0.09);
        opacity: 0;
        transform: translateX(-50%) scale(0.84);
        transition:
          opacity var(--motion-mid) ease-out,
          transform var(--motion-mid) cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .airy-card[data-state="active"] .halo {
        opacity: calc(0.72 * var(--effect-opacity));
        transform: translateX(-50%) scale(1);
      }

      .airy-card[data-state="active"][data-hand-visible="true"] .halo {
        opacity: var(--effect-opacity);
        box-shadow:
          0 0 20px rgba(87, 239, 255, 0.42),
          inset 0 0 25px rgba(87, 239, 255, 0.14);
      }

      .tracking-halo {
        top: 12px;
        width: 116px;
        height: 116px;
        border: 1px dashed rgba(87, 239, 255, 0.66);
        opacity: 0;
        transform: translateX(-50%) scale(0.9);
        transition:
          opacity var(--motion-fast) ease-out,
          transform var(--motion-fast) ease-out;
      }

      .airy-card[data-state="active"][data-pose="pointer"] .tracking-halo {
        opacity: calc(0.72 * var(--effect-opacity));
        transform: translateX(-50%) scale(1);
      }

      .hold-ring {
        top: 0;
        width: 140px;
        height: 140px;
        background: conic-gradient(var(--cyan) calc(var(--hold-progress) * 1turn), rgba(87, 239, 255, 0.08) 0);
        opacity: 0;
        transform: translateX(-50%) rotate(-90deg);
        transition: opacity var(--motion-fast) ease-out;
        -webkit-mask: radial-gradient(circle, transparent 61%, #000 63% 68%, transparent 70%);
        mask: radial-gradient(circle, transparent 61%, #000 63% 68%, transparent 70%);
      }

      .airy-card[data-hold="true"] .hold-ring {
        opacity: var(--effect-opacity);
      }

      .airy-card[data-candidate="abstain"] .hold-ring {
        background: conic-gradient(var(--amber) calc(max(var(--hold-progress), 0.72) * 1turn), rgba(255, 197, 104, 0.1) 0);
        opacity: var(--effect-opacity);
        animation: ring-flicker var(--motion-mid) steps(2, end) 2;
      }

      .execution-ring {
        top: 3px;
        width: 134px;
        height: 134px;
        border: 2px solid var(--green);
        box-shadow: 0 0 12px rgba(117, 240, 187, 0.5);
        opacity: 0;
        transform: translateX(-50%) scale(0.88);
      }

      .airy-card[data-candidate="fire"] .execution-ring {
        animation: confirmation-pulse var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .airy-card[data-action-pulse="true"] .execution-ring {
        animation: action-pulse var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .airy-card[data-secondary="true"] .execution-ring {
        border-color: var(--purple);
        box-shadow: 0 0 14px rgba(185, 140, 255, 0.7);
      }

      .motion-trail {
        top: 41px;
        z-index: 1;
        width: 144px;
        height: 58px;
        border: 0;
        background: linear-gradient(90deg, transparent 4%, rgba(87, 239, 255, 0.12) 24%, rgba(87, 239, 255, 0.58) 50%, rgba(87, 239, 255, 0.12) 76%, transparent 96%);
        filter: blur(2px);
        opacity: 0;
        transform: translateX(-50%);
      }

      .sound-wave {
        top: 19px;
        left: calc(50% + 48px);
        z-index: 3;
        width: 42px;
        height: 42px;
        border: 2px solid rgba(87, 239, 255, 0.9);
        box-shadow: 0 0 5px rgba(87, 239, 255, 0.28);
        opacity: 0;
        transform: translateX(-50%) scale(0.72);
      }

      .sound-wave.wave-two {
        width: 55px;
        height: 55px;
        animation-delay: 85ms !important;
      }

      .scroll-arrow {
        right: 4px;
        z-index: 4;
        display: grid;
        width: 26px;
        height: 26px;
        border: 1px solid rgba(217, 251, 255, 0.72);
        border-radius: 50%;
        color: var(--cyan-white);
        background: rgba(3, 12, 17, 0.9);
        box-shadow: 0 0 7px rgba(87, 239, 255, 0.34);
        font-size: 18px;
        font-weight: 800;
        line-height: 1;
        opacity: 0;
        place-items: center;
        text-shadow: 0 0 5px rgba(87, 239, 255, 0.72);
      }

      .scroll-arrow-up {
        top: 26px;
      }

      .scroll-arrow-down {
        top: 80px;
      }

      .robot-svg {
        position: relative;
        z-index: 2;
        display: block;
        width: min(160px, 100%);
        height: auto;
        overflow: visible;
        opacity: 1;
        visibility: visible;
        filter: drop-shadow(0 8px 8px rgba(0, 5, 8, 0.32));
        transform: scale(var(--airy-scale));
        transform-origin: 50% 56%;
        transition:
          filter var(--motion-mid) ease-out,
          opacity var(--motion-mid) ease-out,
          transform var(--motion-mid) ease-out;
      }

      .robot-sprite {
        transform-origin: 75px 74px;
      }

      .ground-shadow {
        fill: rgba(0, 5, 8, 0.42);
        transform-origin: 75px 123px;
        transition:
          opacity var(--motion-fast) ease-out,
          transform var(--motion-fast) ease-out;
      }

      .shell {
        fill: url(#shell-gradient);
        stroke: rgba(255, 255, 255, 0.72);
        stroke-width: 1.1;
        transition:
          filter var(--motion-mid) ease-out,
          opacity var(--motion-mid) ease-out,
          stroke var(--motion-mid) ease-out;
      }

      .shell-shadow {
        fill: url(#shell-shadow-gradient);
        opacity: 0.74;
      }

      .shell-glint {
        fill: none;
        stroke: rgba(255, 255, 255, 0.8);
        stroke-linecap: round;
        stroke-width: 2.2;
        opacity: 0.74;
      }

      .face {
        fill: url(#face-gradient);
        stroke: rgba(180, 230, 241, 0.18);
        stroke-width: 1;
        transition:
          fill var(--motion-fast) ease-out,
          stroke var(--motion-fast) ease-out,
          opacity var(--motion-fast) ease-out;
      }

      .face-sheen {
        fill: url(#face-sheen-gradient);
        opacity: 0.5;
      }

      .eye-core {
        fill: var(--cyan-white);
        stroke: rgba(255, 255, 255, 0.72);
        stroke-width: 0.5;
        filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px var(--cyan));
        transform: translate(var(--pupil-x), var(--pupil-y));
        transform-box: fill-box;
        transform-origin: center;
        transition:
          fill var(--motion-fast) ease-out,
          stroke var(--motion-fast) ease-out,
          transform var(--motion-fast) ease-out,
          opacity var(--motion-fast) ease-out,
          filter var(--motion-fast) ease-out;
      }

      .eye-glint {
        fill: #ffffff;
        opacity: 0.88;
        transform: translate(var(--pupil-x), var(--pupil-y));
        transition:
          opacity var(--motion-fast) ease-out,
          transform var(--motion-fast) ease-out;
      }

      .eye-lid {
        fill: none;
        stroke: #87979f;
        stroke-linecap: round;
        stroke-width: 2.2;
        opacity: 0;
        transition: opacity var(--motion-fast) ease-out;
      }

      .core-light {
        fill: var(--cyan);
        filter: drop-shadow(0 0 4px rgba(87, 239, 255, 0.76));
        opacity: 0.82;
        transition:
          fill var(--motion-fast) ease-out,
          opacity var(--motion-fast) ease-out,
          filter var(--motion-fast) ease-out;
      }

      .arm {
        opacity: 1;
        visibility: visible;
        transform-box: view-box;
        transition: transform var(--motion-mid) cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .arm-left {
        transform-origin: 43px 69px;
      }

      .arm-right {
        transform-origin: 107px 69px;
      }

      .arm-right.arm-raised {
        transform: rotate(0deg);
      }

      .arm-left.arm-lowered {
        transform: rotate(-104deg);
      }

      .arm-right.arm-lowered {
        transform: rotate(104deg);
      }

      .arm-link {
        fill: none;
        stroke: url(#arm-gradient);
        stroke-linecap: round;
        stroke-width: 14;
        filter: drop-shadow(0 1px 1px rgba(0, 7, 10, 0.82));
        transition:
          opacity var(--motion-fast) ease-out,
          filter var(--motion-fast) ease-out;
      }

      .arm-highlight {
        fill: none;
        stroke: rgba(255, 255, 255, 0.82);
        stroke-linecap: round;
        stroke-width: 2.6;
      }

      .hand {
        opacity: 1;
        visibility: visible;
        fill: url(#shell-gradient);
        stroke: rgba(255, 255, 255, 0.94);
        stroke-width: 1.45;
        filter: drop-shadow(0 0 3px rgba(87, 239, 255, 0.48)) drop-shadow(0 2px 1px rgba(0, 7, 10, 0.74));
      }

      .signal-mote {
        fill: var(--cyan);
        filter: drop-shadow(0 0 4px var(--cyan));
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }

      .airy-card[data-state="active"][data-hand-visible="true"] .eye-core {
        fill: #ffffff;
        filter: drop-shadow(0 0 3px #ffffff) drop-shadow(0 0 8px var(--cyan));
      }

      .airy-card[data-state="active"] .robot-sprite {
        animation: airy-float 3.8s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      .airy-card[data-state="active"] .arm-right.arm-raised {
        animation: airy-wave 3.6s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      .airy-card[data-state="active"][data-feedback-level="full"] .signal-mote {
        opacity: calc(0.82 * var(--effect-opacity));
        animation: mote-twinkle 3.8s ease-in-out infinite;
      }

      .airy-card[data-state="active"] .signal-mote:nth-of-type(2) {
        animation-delay: -1.4s;
      }

      .airy-card[data-state="active"] .signal-mote:nth-of-type(3) {
        animation-delay: -2.6s;
      }

      .airy-card[data-detection="scan"] .eye-core,
      .airy-card[data-detection="scan"] .eye-glint {
        animation: eye-scan var(--motion-slow) ease-in-out 2;
      }

      .airy-card[data-candidate="abstain"] .robot-sprite {
        animation: reject-shake var(--motion-mid) ease-out;
      }

      .airy-card[data-state="inactive"] .halo,
      .airy-card[data-state="offline"] .halo,
      .airy-card[data-camera-state="off"] .halo,
      .airy-card[data-camera-state="starting"] .halo,
      .airy-card[data-camera-state="error"] .halo {
        opacity: 0;
      }

      .airy-card[data-state="inactive"] .eye-core {
        fill: #5a747b;
        stroke: transparent;
        filter: none;
        opacity: 0.64;
        transform: scaleY(0.15) scaleX(0.88);
      }

      .airy-card[data-state="inactive"] .eye-glint {
        opacity: 0;
      }

      .airy-card[data-state="inactive"] .eye-lid {
        opacity: 0.78;
      }

      .airy-card[data-state="inactive"] .face,
      .airy-card[data-state="inactive"] .arm-link,
      .airy-card[data-state="inactive"] .hand {
        opacity: 0.9;
      }

      .airy-card[data-state="inactive"] .core-light {
        fill: #61747a;
        filter: none;
        opacity: 0.46;
      }

      .airy-card[data-state="offline"] .robot-svg {
        opacity: 0.82;
        filter: grayscale(0.86);
      }

      .airy-card[data-state="offline"] .shell {
        filter: brightness(0.72) saturate(0);
      }

      .airy-card[data-state="offline"] .face {
        fill: #121a1e;
        stroke: rgba(180, 193, 198, 0.18);
      }

      .airy-card[data-state="offline"] .eye-core {
        fill: transparent;
        stroke: #829198;
        stroke-width: 1.8;
        filter: none;
        opacity: 0.74;
      }

      .airy-card[data-state="offline"] .eye-glint,
      .airy-card[data-state="offline"] .eye-lid {
        opacity: 0;
      }

      .airy-card[data-state="offline"] .core-light {
        fill: transparent;
        stroke: #68777d;
        stroke-width: 1;
        filter: none;
        opacity: 0.56;
      }

      .airy-card[data-state="offline"] .ground-shadow {
        opacity: 0.58;
        transform: scaleX(0.88);
      }

      .airy-card[data-camera-state="off"] .robot-svg,
      .airy-card[data-camera-state="starting"] .robot-svg {
        opacity: 0.78;
        filter: grayscale(0.72);
      }

      .camera-warning {
        position: absolute;
        top: 12px;
        left: 50%;
        z-index: 5;
        display: none;
        min-width: 112px;
        padding: 5px 9px;
        border-radius: 7px;
        color: #fff1f1;
        background: #6f2026;
        font-size: 10px;
        font-weight: 760;
        letter-spacing: 0.06em;
        text-align: center;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .airy-card[data-camera-state="error"] {
        border-color: rgba(255, 107, 107, 0.72);
        background: linear-gradient(155deg, rgba(67, 24, 29, 0.96), rgba(27, 10, 14, 0.98));
      }

      .airy-card[data-camera-state="error"] .camera-warning {
        display: block;
      }

      .airy-card[data-camera-state="error"] .robot-svg {
        opacity: 0.78;
        filter: grayscale(0.7) sepia(0.3) hue-rotate(310deg);
      }

      .airy-card[data-camera-state="error"] .eye-core,
      .airy-card[data-camera-state="error"] .core-light {
        fill: var(--red);
        filter: none;
      }

      .airy-card[data-camera-state="error"] .robot-sprite,
      .airy-card[data-camera-state="error"] .arm,
      .airy-card[data-camera-state="error"] .signal-mote {
        animation: none !important;
      }

      /* Execution hooks intentionally key from the daemon's semantic category. */
      .airy-card[data-category="click"][data-action-pulse="true"] .arm-right {
        animation: click-point var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .airy-card[data-category="click"][data-action-pulse="true"] .eye-right {
        animation: eye-wink var(--motion-fast) ease-out;
      }

      .airy-card[data-category="drag"][data-reaction-phase="active"][data-action-pulse="true"] .robot-sprite {
        animation: drag-lean var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .airy-card[data-category="drag"][data-reaction-phase="active"][data-action-pulse="true"] .arm-left {
        animation: drag-grab-left var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .airy-card[data-category="drag"][data-reaction-phase="active"][data-action-pulse="true"] .arm-right {
        animation: drag-grab-right var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .airy-card[data-category="drag"][data-reaction-phase="active"][data-action-pulse="true"] .motion-trail {
        animation: trail-sweep var(--motion-mid) ease-out infinite;
      }

      .airy-card[data-category="drag"][data-reaction-phase="settle"][data-action-pulse="true"] .robot-sprite {
        animation: drag-settle var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .airy-card[data-category="drag"][data-reaction-phase="settle"][data-action-pulse="true"] .arm-left {
        animation: drag-release-left var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .airy-card[data-category="drag"][data-reaction-phase="settle"][data-action-pulse="true"] .arm-right {
        animation: drag-release-right var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .airy-card[data-category="drag"][data-reaction-phase="settle"][data-action-pulse="true"] .motion-trail {
        animation: trail-settle var(--motion-mid) ease-out;
      }

      .airy-card[data-category="scroll"][data-direction="up"][data-action-pulse="true"] .robot-sprite {
        animation: scroll-up var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .airy-card[data-category="scroll"][data-direction="down"][data-action-pulse="true"] .robot-sprite {
        animation: scroll-down var(--motion-mid) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .airy-card[data-category="scroll"][data-direction="neutral"][data-action-pulse="true"] .robot-sprite {

                <stop offset="0" stop-color="#e9f1f2" />

            </defs>

            <ellipse class="ground-shadow" cx="75" cy="122" rx="36" ry="5" />
            <g class="robot-sprite">
              <rect class="shell" x="35" y="20" width="80" height="98" rx="38" />
              <path class="shell-shadow" d="M38 77c9 22 24 34 43 34 13 0 23-4 31-13-7 14-20 20-37 20-22 0-37-14-40-37Z" />

              <rect class="face" x="43" y="35" width="64" height="43" rx="21.5" />
              <path class="face-sheen" d="M47 53c2-10 10-15 21-15h19c8 0 14 3 17 9-17-5-36-2-57 6Z" />

              <ellipse class="eye-core eye-left" cx="62" cy="56" rx="7.4" ry="9.2" />
              <ellipse class="eye-core eye-right" cx="88" cy="56" rx="7.4" ry="9.2" />
              <ellipse class="eye-glint" cx="59.7" cy="52.4" rx="1.7" ry="2.3" />
              <ellipse class="eye-glint" cx="85.7" cy="52.4" rx="1.7" ry="2.3" />

              <rect x="58" y="88" width="34" height="16" rx="8" fill="#81949a" opacity="0.54" />

                <path class="hand" d="M118 43c0-5 3-9 7-10 2-1 3 1 2 3l-1 4 4-5c1-2 4 0 3 2l-3 6 4-3c2-1 4 2 2 3l-7 6c-5 3-10-1-11-6Z" />

              <circle class="signal-mote" cx="30" cy="45" r="1.5" />

      <span id="action-label" class="action-label no-drag" data-visible="false" role="status" aria-live="polite"></span>
      <span class="camera-warning" aria-hidden="true">CAMERA ERROR</span>

      <aside id="control-menu" class="control-menu no-drag" role="menu" aria-label="Airy controls" hidden>
        <div class="menu-heading">Airy controls</div>
        <div class="menu-grid">
          <button id="pause-button" class="menu-button" type="button" role="menuitem" aria-label="Pause or Resume">
            <span id="pause-label">Pause / Resume</span>
          </button>
          <button id="dashboard-button" class="menu-button" type="button" role="menuitem">Open dashboard</button>
          <div class="menu-status" role="status" aria-live="polite">
            <span>Camera status</span>
            <strong id="menu-camera-status">Unknown</strong>
          </div>
          <button id="exit-button" class="menu-button menu-exit" type="button" role="menuitem">Exit</button>
          <button class="menu-button deferred-button" type="button" role="menuitem" data-dashboard-route="recalibrate">Recalibrate</button>
          <button class="menu-button deferred-button" type="button" role="menuitem" data-dashboard-route="switch-profile">Switch profile</button>
        </div>
        <p id="menu-note" class="menu-note">Open the dashboard to recalibrate or switch profile.</p>
      </aside>

      <section class="status-pill pywebview-drag-region" role="status" aria-live="polite" aria-atomic="true">
        <span class="state-dot" aria-hidden="true"></span>
        <span class="status-copy">
          <strong id="status-name" class="status-name">Offline</strong>
          <span id="status-detail" class="status-detail">AirControl is not running</span>
        </span>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const DEFAULT_WS_URL = "ws://127.0.0.1:8787";
        const BRIDGE_READY_TIMEOUT_MS = 2000;
        const RECONNECT_BASE_MS = 500;
        const RECONNECT_MAX_MS = 8000;
        const DRAG_THRESHOLD_PX = 6;
        const ACTION_LABEL_MS = 1200;
        const REACTION_MS = 520;
        const CANDIDATE_MS = 460;
        const SCAN_MS = 780;
        const HIGH_CONFIDENCE = 0.7;
        const FEEDBACK_LEVELS = new Set(["full", "subtle", "minimal", "hidden"]);
        const AIRY_SIZES = new Set(["small", "medium", "large"]);
        const ACTION_CATEGORIES = new Set([
          "click",
          "drag",
          "scroll",
          "window",
          "volume",
          "mute",
          "media",
          "system",
          "hotkey",
          "pointer",
          "secondary",
        ]);
        const DEFAULT_SETTINGS = Object.freeze({
          airy_enabled: true,
          airy_feedback_level: "full",
          airy_sounds: false,
          airy_animation_intensity: 80,
          airy_size: "medium",
          airy_on_top: true,
        });

        const card = document.getElementById("airy-card");
        const companionButton = document.getElementById("companion-button");
        const closeButton = document.getElementById("close-button");
        const airyLeftArm = document.getElementById("airy-arm-left");
        const airyRightArm = document.getElementById("airy-arm-right");
        const statusName = document.getElementById("status-name");
        const statusDetail = document.getElementById("status-detail");
        const actionLabel = document.getElementById("action-label");
        const controlMenu = document.getElementById("control-menu");
        const pauseButton = document.getElementById("pause-button");
        const pauseLabel = document.getElementById("pause-label");
        const dashboardButton = document.getElementById("dashboard-button");
        const exitButton = document.getElementById("exit-button");
        const menuCameraStatus = document.getElementById("menu-camera-status");
        const menuNote = document.getElementById("menu-note");

        let socket = null;
        let connected = false;
        let statusKnown = false;
        let armed = false;
        let rawPose = "No hand";
        let activePose = "Neutral";
        let holdProgress = 0;
        let handVisible = false;
        let statusText = "";
        let cameraState = "unknown";
        let cameraError = "";
        let settings = { ...DEFAULT_SETTINGS };
        let reconnectAttempt = 0;
        let reconnectTimer = null;
        let reactionTimer = null;
        let candidateTimer = null;
        let actionLabelTimer = null;
        let scanTimer = null;
        let shuttingDown = false;
        let webSocketUrl = DEFAULT_WS_URL;
        let suppressNextCompanionClick = false;
        let pointerHeld = false;
        let pointerMovedWhileHeld = false;
        let lastNativeHidden = null;
        let audioContext = null;

        const motionQuery = typeof window.matchMedia === "function"
          ? window.matchMedia("(prefers-reduced-motion: reduce)")
          : null;
        let osReducedMotion = Boolean(motionQuery && motionQuery.matches);

        function loopbackWebSocketUrl(value) {
          if (typeof value !== "string" || !value) return DEFAULT_WS_URL;
          try {
            const candidate = new URL(value);
            const allowedHost = candidate.hostname === "127.0.0.1" || candidate.hostname === "localhost";
            if (candidate.protocol !== "ws:" || !allowedHost || candidate.username || candidate.password) {
              return DEFAULT_WS_URL;
            }
            return candidate.toString();
          } catch (_error) {
            return DEFAULT_WS_URL;
          }
        }

        function bootstrapApi() {
          const bridge = window.pywebview;
          if (!bridge || !bridge.api || typeof bridge.api.get_bootstrap !== "function") return null;
          return bridge.api;
        }

        function waitForBootstrapApi() {
          const availableApi = bootstrapApi();
          if (availableApi) return Promise.resolve(availableApi);
          const shouldWait = window.location.protocol === "file:" || Boolean(window.pywebview);
          if (!shouldWait) return Promise.resolve(null);

          return new Promise((resolve) => {
            let settled = false;
            let timeoutId = null;
            const finish = () => {
              if (settled) return;
              settled = true;
              window.removeEventListener("pywebviewready", onReady);
              if (timeoutId !== null) window.clearTimeout(timeoutId);
              resolve(bootstrapApi());
            };
            const onReady = () => finish();
            window.addEventListener("pywebviewready", onReady, { once: true });
            if (bootstrapApi()) {
              finish();
              return;
            }
            timeoutId = window.setTimeout(finish, BRIDGE_READY_TIMEOUT_MS);
          });
        }

        function normalizeBootstrap(value) {
          return {
            wsUrl: loopbackWebSocketUrl(value && value.ws_url),
            nativeDrag: Boolean(value && value.native_drag === true),
          };
        }

        async function loadBootstrap() {
          const api = await waitForBootstrapApi();
          if (!api) return normalizeBootstrap(null);
          try {
            return normalizeBootstrap(await api.get_bootstrap());
          } catch (_error) {
            return normalizeBootstrap(null);
          }
        }

        function effectiveFeedbackLevel() {
          if (settings.airy_enabled === false) return "hidden";
          return FEEDBACK_LEVELS.has(settings.airy_feedback_level)
            ? settings.airy_feedback_level
            : DEFAULT_SETTINGS.airy_feedback_level;
        }

        function effectiveReducedMotion() {
          return osReducedMotion || effectiveFeedbackLevel() === "minimal" || settings.airy_animation_intensity === 0;
        }

        function stateKey() {
          if (!connected || !statusKnown) return "offline";
          return armed ? "active" : "inactive";
        }

        function cameraLabel() {
          if (cameraState === "active") return "Active";
          if (cameraState === "starting") return "Starting";
          if (cameraState === "off") return "Off";
          if (cameraState === "error") return cameraError ? `Error · ${cameraError}` : "Error";
          return "Unknown";
        }

        function displayStatus() {
          if (!connected) {
            return { name: "Offline", detail: "AirControl is not running" };
          }
          if (cameraState === "error") {
            return { name: "Camera error", detail: cameraError || "Camera unavailable" };
          }
          if (cameraState === "starting") {
            return { name: "Camera starting", detail: "Starting local vision" };
          }
          if (cameraState === "off") {
            return { name: "Camera off", detail: "Paused · Camera is off" };
          }
          if (!statusKnown) {
            return { name: "Offline", detail: "Waiting for AirControl status" };
          }
          if (armed) {
            return {
              name: "Active",
              detail: statusText || (handVisible ? "Hand detected" : "Ready · Scanning for a hand"),
            };
          }
          return {
            name: "Inactive",
            detail: statusText || "Paused · Gesture tracking stopped",
          };
        }

        function requestNativeVisibility(hidden) {
          if (lastNativeHidden === hidden) return;
          lastNativeHidden = hidden;
          const api = window.pywebview && window.pywebview.api;
          const hook = api && (hidden ? api.hide_widget : api.show_widget);
          if (typeof hook !== "function") return;
          try {
            Promise.resolve(hook.call(api)).catch(() => undefined);
          } catch (_error) {
            // The current bridge has no visibility hook; drawing nothing is the safe fallback.
          }
        }

        function applyVisualSettings() {
          const level = effectiveFeedbackLevel();
          const size = AIRY_SIZES.has(settings.airy_size) ? settings.airy_size : "medium";
          const intensity = Number.isInteger(settings.airy_animation_intensity)
            ? Math.max(0, Math.min(100, settings.airy_animation_intensity))
            : DEFAULT_SETTINGS.airy_animation_intensity;
          const ratio = intensity / 100;
          const reduced = effectiveReducedMotion();
          const sizeScale = size === "small" ? 0.84 : size === "large" ? 1.08 : 1;
          const levelScale = level === "full" ? 1 : level === "subtle" ? 0.45 : 0;
          const motionScale = ratio * levelScale;
          const amplitude = Math.round(4 + motionScale * 20);
          const armAngle = Math.round(7 + motionScale * 23);
          const armCounterAngle = Math.round(5 + motionScale * 16) * -1;
          const effectScale = level === "subtle" ? 0.62 : level === "minimal" ? 0.36 : 1;

          document.body.dataset.feedbackLevel = level;
          card.dataset.feedbackLevel = level;
          card.dataset.size = size;
          card.dataset.reducedMotion = String(reduced);
          card.style.setProperty("--airy-scale", String(sizeScale));
          card.style.setProperty("--effect-opacity", String(0.18 + ratio * 0.82 * effectScale));
          card.style.setProperty("--motion-amplitude", `${amplitude}px`);
          card.style.setProperty("--motion-amplitude-negative", `${amplitude * -1}px`);
          card.style.setProperty("--arm-motion-angle", `${armAngle}deg`);
          card.style.setProperty("--arm-motion-counter-angle", `${armCounterAngle}deg`);
          card.style.setProperty("--motion-fast", reduced ? "1ms" : `${Math.round(150 + ratio * 70)}ms`);
          card.style.setProperty("--motion-mid", reduced ? "1ms" : `${Math.round(250 + ratio * 140)}ms`);
          card.style.setProperty("--motion-slow", reduced ? "1ms" : `${Math.round(420 + ratio * 200)}ms`);

          const hidden = level === "hidden";
          if (hidden) closeMenu(false);
          card.hidden = hidden;
          card.setAttribute("aria-hidden", String(hidden));
          requestNativeVisibility(hidden);
        }

        function render() {
          applyVisualSettings();
          const key = stateKey();
          const display = displayStatus();
          const cameraVisualState = connected ? cameraState : "unknown";
          const pose = activePose.toLowerCase() === "pointer" ? "pointer" : "neutral";
          const holdActive = holdProgress > 0 && holdProgress < 1;
          const awake = key === "active" && !["off", "starting", "error"].includes(cameraVisualState);

          card.dataset.state = key;
          card.dataset.cameraState = cameraVisualState;
          card.dataset.handVisible = String(handVisible);
          card.dataset.pose = pose;
          card.dataset.hold = String(holdActive);
          card.style.setProperty("--hold-progress", String(Math.max(0, Math.min(1, holdProgress))));
          statusName.textContent = display.name;
          statusDetail.textContent = display.detail;
          menuCameraStatus.textContent = cameraLabel();
          pauseLabel.textContent = armed ? "Pause" : "Resume";
          companionButton.setAttribute("aria-label", `${display.name}. Open Airy controls`);
          airyLeftArm.classList.remove("arm-raised");
          airyLeftArm.classList.add("arm-lowered");
          airyRightArm.classList.toggle("arm-raised", awake);
          airyRightArm.classList.toggle("arm-lowered", !awake);
        }

        function sendCommand(name) {
          if (!socket || socket.readyState !== WebSocket.OPEN) return false;
          socket.send(JSON.stringify({ v: 1, type: "command", name }));
          return true;
        }

        function normalizeSettings(value) {
          if (!value || typeof value !== "object") return;
          const next = { ...settings };
          if (typeof value.airy_enabled === "boolean") next.airy_enabled = value.airy_enabled;
          if (FEEDBACK_LEVELS.has(value.airy_feedback_level)) next.airy_feedback_level = value.airy_feedback_level;
          if (typeof value.airy_sounds === "boolean") next.airy_sounds = value.airy_sounds;
          if (Number.isInteger(value.airy_animation_intensity) && value.airy_animation_intensity >= 0 && value.airy_animation_intensity <= 100) {
            next.airy_animation_intensity = value.airy_animation_intensity;
          }
          if (AIRY_SIZES.has(value.airy_size)) next.airy_size = value.airy_size;
          if (typeof value.airy_on_top === "boolean") next.airy_on_top = value.airy_on_top;
          settings = next;
          render();
        }

        function setCameraState(state, error) {
          if (!["off", "starting", "active", "error"].includes(state)) return;
          cameraState = state;
          cameraError = state === "error" && typeof error === "string" ? error : "";
          render();
        }

        function clearTimer(timer) {
          if (timer !== null) window.clearTimeout(timer);
        }

        function handleStatus(message) {
          if (typeof message.armed !== "boolean") return;
          const wasHandVisible = handVisible;
          statusKnown = true;
          connected = true;
          armed = message.armed;
          if (typeof message.raw_pose === "string") rawPose = message.raw_pose;
          if (typeof message.active_pose === "string") activePose = message.active_pose;
          if (typeof message.hold_progress === "number" && Number.isFinite(message.hold_progress)) {
            holdProgress = Math.max(0, Math.min(1, message.hold_progress));
          }
          if (typeof message.hand_visible === "boolean") handVisible = message.hand_visible;
          if (typeof message.status_text === "string") statusText = message.status_text;

          clearTimer(scanTimer);
          scanTimer = null;
          if (handVisible) {
            card.dataset.detection = "seen";
          } else if (armed && wasHandVisible) {
            card.dataset.detection = "scan";
            scanTimer = window.setTimeout(() => {
              card.dataset.detection = "idle";
              scanTimer = null;
            }, SCAN_MS);
          } else {
            card.dataset.detection = "idle";
          }
          render();
        }

        function handleCandidate(message) {
          if (message.gate !== "fire" && message.gate !== "abstain") return;
          const confidence = typeof message.confidence === "number" && Number.isFinite(message.confidence)
            ? message.confidence
            : 0;
          const rejected = message.gate === "abstain" || confidence < HIGH_CONFIDENCE;
          clearTimer(candidateTimer);
          card.dataset.candidate = "idle";
          void card.offsetWidth;
          card.dataset.candidate = rejected ? "abstain" : "fire";
          card.dataset.candidateReason = typeof message.reason === "string" ? message.reason : "";
          card.dataset.candidateConfidence = String(confidence);
          candidateTimer = window.setTimeout(() => {
            card.dataset.candidate = "idle";
            candidateTimer = null;
          }, CANDIDATE_MS);
        }

        function clampDirection(value) {
          if (typeof value !== "number" || !Number.isFinite(value)) return 0;
          return Math.max(-1, Math.min(1, value));
        }

        function updatePupilDirection(message) {
          const dx = clampDirection(message.dx);
          const dy = clampDirection(message.dy);
          card.style.setProperty("--pupil-x", `${(dx * 3).toFixed(2)}px`);
          card.style.setProperty("--pupil-y", `${(dy * 2.5).toFixed(2)}px`);
        }

        function actionDirection(message, category) {
          if (["left", "right", "up", "down"].includes(message.direction)) return message.direction;
          if (typeof message.amount === "number" && message.amount !== 0) {
            return message.amount > 0 ? "up" : "down";
          }
          const description = typeof message.description === "string" ? message.description.toUpperCase() : "";
          if (category === "scroll") {
            if (description.includes("UP")) return "up";
            if (description.includes("DOWN")) return "down";
          }
          if (category === "window") {
            if (message.kind === "switch_previous") return "left";
            if (message.kind === "switch_next") return "right";
          }
          return "neutral";
        }

        function isSecondaryAction(message) {
          if (message.secondary === true) return true;
          if (message.category === "secondary" || message.kind === "right_click") return true;
          return typeof message.description === "string" && /\b(?:RIGHT CLICK|SECONDARY)\b/i.test(message.description);
        }

        function usefulDescription(message) {
          if (typeof message.description !== "string") return "";
          const text = message.description.trim();
          if (!text || /^HOTKEY\s*[·:]/i.test(text)) return "";
          return text;
        }

        function labelForAction(message, category, phase) {
          if (isSecondaryAction(message)) return "RIGHT CLICK";
          if (category === "click") return "LEFT CLICK";
          if (category === "drag") return phase === "settle" ? "DRAG RELEASED" : "DRAGGING";
          if (category === "scroll") return usefulDescription(message) || "SCROLLING";
          if (category === "window") return usefulDescription(message) || "WINDOW SWITCH";
          if (category === "volume") {
            const description = usefulDescription(message);
            return /VOLUME/i.test(description) ? description : "VOLUME";
          }
          if (category === "mute") return "MUTE";
          if (category === "media") return usefulDescription(message) || "MEDIA";
          if (category === "system" || category === "hotkey") return usefulDescription(message) || category.toUpperCase();
          return category.toUpperCase();
        }

        function showActionLabel(text) {
          clearTimer(actionLabelTimer);
          actionLabelTimer = null;
          if (effectiveFeedbackLevel() !== "full" || !text) {
            actionLabel.textContent = "";
            actionLabel.dataset.visible = "false";
            return;
          }
          actionLabel.textContent = text.slice(0, 36).toUpperCase();
          actionLabel.dataset.visible = "true";
          actionLabelTimer = window.setTimeout(() => {
            actionLabel.dataset.visible = "false";
            actionLabelTimer = null;
          }, ACTION_LABEL_MS);
        }

        function playBlip(category, secondary) {
          if (
            effectiveFeedbackLevel() !== "full" ||
            settings.airy_sounds !== true ||
            effectiveReducedMotion()
          ) return;
          const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
          if (typeof AudioContextConstructor !== "function") return;
          try {
            audioContext = audioContext || new AudioContextConstructor();
            const now = audioContext.currentTime;
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const frequencies = {
              click: 680,
              drag: 410,
              scroll: 520,
              window: 620,
              volume: 740,
              mute: 280,
              media: 590,
              system: 480,
              hotkey: 480,
            };
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(secondary ? 560 : (frequencies[category] || 500), now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.035, now + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(now);
            oscillator.stop(now + 0.08);
          } catch (_error) {
            // Audio feedback is optional; visual feedback remains authoritative.
          }
        }

        function triggerReaction(category, message, phase = "pulse", persistent = false) {
          clearTimer(reactionTimer);
          reactionTimer = null;
          card.dataset.category = category;
          card.dataset.action = typeof message.kind === "string" ? message.kind : "unknown";
          card.dataset.direction = actionDirection(message, category);
          card.dataset.reactionPhase = phase;
          card.dataset.secondary = String(isSecondaryAction(message));
          card.dataset.actionPulse = "false";
          void card.offsetWidth;
          card.dataset.actionPulse = "true";
          if (category !== "pointer") showActionLabel(labelForAction(message, category, phase));
          playBlip(category, isSecondaryAction(message));
          if (!persistent) {
            reactionTimer = window.setTimeout(() => {
              card.dataset.actionPulse = "false";
              card.dataset.category = "none";
              card.dataset.action = "none";
              card.dataset.direction = "neutral";
              card.dataset.reactionPhase = "idle";
              card.dataset.secondary = "false";
              reactionTimer = null;
            }, REACTION_MS);
          }
        }

        function handleAction(message) {
          const category = ACTION_CATEGORIES.has(message.category) ? message.category : "hotkey";
          if (category === "click" && message.kind === "left_down") {
            pointerHeld = true;
            pointerMovedWhileHeld = false;
            return;
          }
          if (category === "click" && message.kind === "left_up") {
            if (!pointerHeld) return;
            const wasDrag = pointerMovedWhileHeld;
            pointerHeld = false;
            pointerMovedWhileHeld = false;
            triggerReaction(wasDrag ? "drag" : "click", message, wasDrag ? "settle" : "pulse");
            return;
          }
          if (category === "pointer") {
            updatePupilDirection(message);
            if (pointerHeld) {
              const startingDrag = !pointerMovedWhileHeld;
              pointerMovedWhileHeld = true;
              if (startingDrag) triggerReaction("drag", message, "active", true);
            } else {
              triggerReaction("pointer", message);
            }
            return;
          }
          if (category === "drag") {
            const releasing = message.kind === "left_up";
            pointerHeld = !releasing;
            pointerMovedWhileHeld = !releasing;
            triggerReaction("drag", message, releasing ? "settle" : "active", !releasing);
            return;
          }
          triggerReaction(category === "secondary" ? "click" : category, message);
        }

        function handleMessage(message) {
          if (!message || message.v !== 1 || typeof message.type !== "string") return;
          if (message.type === "status") {
            handleStatus(message);
            return;
          }
          if (message.type === "candidate") {
            handleCandidate(message);
            return;
          }
          if (message.type === "action") {
            handleAction(message);
            return;
          }
          if (message.type === "camera") {
            setCameraState(message.state, message.camera_error ?? message.error);
            return;
          }
          if (message.type === "settings" && message.payload && typeof message.payload === "object") {
            setCameraState(message.payload.camera_state, message.payload.camera_error);
            return;
          }
          if (message.type === "app_settings") {
            normalizeSettings(message.settings);
          }
        }

        function scheduleReconnect() {
          if (shuttingDown || reconnectTimer !== null) return;
          const delay = Math.min(RECONNECT_MAX_MS, RECONNECT_BASE_MS * 2 ** reconnectAttempt);
          reconnectAttempt += 1;
          reconnectTimer = window.setTimeout(() => {
            reconnectTimer = null;
            connect();
          }, delay);
        }

        function resetConnectionTruth() {
          connected = false;
          statusKnown = false;
          armed = false;
          rawPose = "No hand";
          activePose = "Neutral";
          holdProgress = 0;
          handVisible = false;
          statusText = "";
          cameraState = "unknown";
          cameraError = "";
          pointerHeld = false;
          pointerMovedWhileHeld = false;
          card.dataset.detection = "idle";
          card.dataset.candidate = "idle";
          card.dataset.category = "none";
          card.dataset.action = "none";
          card.dataset.direction = "neutral";
          card.dataset.reactionPhase = "idle";
          card.dataset.actionPulse = "false";
          card.dataset.secondary = "false";
          card.style.setProperty("--pupil-x", "0px");
          card.style.setProperty("--pupil-y", "0px");
          closeMenu(false);
          render();
        }

        function connect() {
          if (shuttingDown) return;
          let nextSocket;
          try {
            nextSocket = new WebSocket(webSocketUrl);
          } catch (_error) {
            resetConnectionTruth();
            scheduleReconnect();
            return;
          }

          socket = nextSocket;
          nextSocket.addEventListener("open", () => {
            if (socket !== nextSocket) return;
            connected = true;
            statusKnown = false;
            reconnectAttempt = 0;
            render();
            sendCommand("get_status");
            sendCommand("get_settings");
            sendCommand("get_app_settings");
          });

          nextSocket.addEventListener("message", (event) => {
            if (socket !== nextSocket || typeof event.data !== "string") return;
            try {
              handleMessage(JSON.parse(event.data));
            } catch (_error) {
              // Ignore malformed daemon frames; the last real state stays authoritative.
            }
          });

          nextSocket.addEventListener("close", () => {
            if (socket !== nextSocket) return;
            socket = null;
            resetConnectionTruth();
            scheduleReconnect();
          });

          nextSocket.addEventListener("error", () => {
            if (socket === nextSocket) nextSocket.close();
          });
        }

        async function closeWidget() {
          try {
            if (window.pywebview && window.pywebview.api && window.pywebview.api.close_widget) {
              await window.pywebview.api.close_widget();
              return;
            }
          } catch (_error) {
            // Fall through to the browser close attempt if the native bridge failed.
          }
          window.close();
        }

        function openMenu() {
          if (card.hidden) return;
          controlMenu.hidden = false;
          companionButton.setAttribute("aria-expanded", "true");
          window.requestAnimationFrame(() => pauseButton.focus());
        }

        function closeMenu(returnFocus = true) {
          if (controlMenu.hidden) return;
          controlMenu.hidden = true;
          companionButton.setAttribute("aria-expanded", "false");
          if (returnFocus) companionButton.focus();
        }

        function toggleMenu() {
          if (controlMenu.hidden) openMenu();
          else closeMenu();
        }

        function installDragSupport(nativeDrag) {
          let queuedPosition = null;
          let animationFrame = null;
          const flushMove = () => {
            animationFrame = null;
            if (!queuedPosition) return;
            const api = window.pywebview && window.pywebview.api;
            if (api && typeof api.move_window === "function") {
              try {
                api.move_window(queuedPosition.x, queuedPosition.y);
              } catch (_error) {
                // A missing native window should not break menu interaction.
              }
            }
            queuedPosition = null;
          };
          const queueMove = (drag, event) => {
            queuedPosition = {
              x: Math.round(drag.windowX + event.screenX - drag.pointerX),
              y: Math.round(drag.windowY + event.screenY - drag.pointerY),
            };
            if (animationFrame === null) animationFrame = window.requestAnimationFrame(flushMove);
          };

          if (!nativeDrag) {
            card.classList.add("js-drag-fallback");
            let surfaceDrag = null;
            card.addEventListener("pointerdown", (event) => {
              if (event.button !== 0 || event.target.closest(".no-drag")) return;
              surfaceDrag = {
                pointerId: event.pointerId,
                pointerX: event.screenX,
                pointerY: event.screenY,
                windowX: window.screenX,
                windowY: window.screenY,
              };
              card.dataset.dragging = "true";
              if (typeof card.setPointerCapture === "function") card.setPointerCapture(event.pointerId);
              event.preventDefault();
            });
            card.addEventListener("pointermove", (event) => {
              if (!surfaceDrag || event.pointerId !== surfaceDrag.pointerId) return;
              queueMove(surfaceDrag, event);
            });
            const finishSurfaceDrag = (event) => {
              if (!surfaceDrag || event.pointerId !== surfaceDrag.pointerId) return;
              surfaceDrag = null;
              card.dataset.dragging = "false";
              if (typeof card.hasPointerCapture === "function" && card.hasPointerCapture(event.pointerId)) {
                card.releasePointerCapture(event.pointerId);
              }
            };
            card.addEventListener("pointerup", finishSurfaceDrag);
            card.addEventListener("pointercancel", finishSurfaceDrag);
          }

          let companionDrag = null;
          companionButton.addEventListener("pointerdown", (event) => {
            if (event.button !== 0 || !controlMenu.hidden) return;
            companionDrag = {
              pointerId: event.pointerId,
              pointerX: event.screenX,
              pointerY: event.screenY,
              windowX: window.screenX,
              windowY: window.screenY,
              moved: false,
            };
            if (typeof companionButton.setPointerCapture === "function") companionButton.setPointerCapture(event.pointerId);
          });
          companionButton.addEventListener("pointermove", (event) => {
            if (!companionDrag || event.pointerId !== companionDrag.pointerId) return;
            const distance = Math.hypot(event.screenX - companionDrag.pointerX, event.screenY - companionDrag.pointerY);
            if (distance < DRAG_THRESHOLD_PX) return;
            companionDrag.moved = true;
            card.dataset.dragging = "true";
            queueMove(companionDrag, event);
            event.preventDefault();
          });
          const finishCompanionDrag = (event) => {
            if (!companionDrag || event.pointerId !== companionDrag.pointerId) return;
            suppressNextCompanionClick = companionDrag.moved;
            companionDrag = null;
            card.dataset.dragging = "false";
            if (
              typeof companionButton.hasPointerCapture === "function" &&
              companionButton.hasPointerCapture(event.pointerId)
            ) companionButton.releasePointerCapture(event.pointerId);
          };
          companionButton.addEventListener("pointerup", finishCompanionDrag);
          companionButton.addEventListener("pointercancel", finishCompanionDrag);
        }

        companionButton.addEventListener("click", () => {
          if (suppressNextCompanionClick) {
            suppressNextCompanionClick = false;
            return;
          }
          toggleMenu();
        });

        pauseButton.addEventListener("click", () => {
          sendCommand("toggle_arm");
          closeMenu();
        });

        dashboardButton.addEventListener("click", () => {
          sendCommand("focus_dashboard");
          closeMenu();
        });

        document.querySelectorAll("[data-dashboard-route]").forEach((button) => {
          button.addEventListener("click", () => {
            menuNote.textContent = "Open the dashboard to recalibrate or switch profile.";
            sendCommand("focus_dashboard");
            closeMenu();
          });
        });

        exitButton.addEventListener("click", () => {
          sendCommand("quit");
          closeMenu(false);
        });

        closeButton.addEventListener("click", closeWidget);

        document.addEventListener("pointerdown", (event) => {
          if (controlMenu.hidden) return;
          if (controlMenu.contains(event.target) || companionButton.contains(event.target)) return;
          closeMenu(false);
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !controlMenu.hidden) {
            event.preventDefault();
            closeMenu();
            return;
          }
          if (controlMenu.hidden || !["ArrowDown", "ArrowUp"].includes(event.key)) return;
          const items = Array.from(controlMenu.querySelectorAll("button:not([disabled])"));
          const current = items.indexOf(document.activeElement);
          const delta = event.key === "ArrowDown" ? 1 : -1;
          const next = (current + delta + items.length) % items.length;
          event.preventDefault();
          items[next].focus();
        });

        if (motionQuery) {
          const onMotionChange = (event) => {
            osReducedMotion = event.matches;
            render();
          };
          if (typeof motionQuery.addEventListener === "function") motionQuery.addEventListener("change", onMotionChange);
          else if (typeof motionQuery.addListener === "function") motionQuery.addListener(onMotionChange);
        }

        window.addEventListener("beforeunload", () => {
          shuttingDown = true;
          [reconnectTimer, reactionTimer, candidateTimer, actionLabelTimer, scanTimer].forEach(clearTimer);
          if (socket) socket.close();
          if (audioContext && typeof audioContext.close === "function") {
            try {
              audioContext.close();
            } catch (_error) {
              // The audio context may already be closed.
            }
          }
        });

        render();
        loadBootstrap().then((bootstrap) => {
          if (shuttingDown) return;
          webSocketUrl = bootstrap.wsUrl;
          installDragSupport(bootstrap.nativeDrag);
          connect();
        });
      })();
    </script>
  </body>
</html>
