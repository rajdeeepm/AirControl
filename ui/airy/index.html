<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ws://127.0.0.1:8787 ws://127.0.0.1:* ws://localhost:*; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airy · AirControl companion</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-rounded, "Segoe UI Variable", "Segoe UI", sans-serif;
        font-synthesis: none;
        --cyan: #57efff;
        --cyan-white: #d9fbff;
        --ink: #071016;
        --muted: #91a4ad;
        --card: rgba(10, 19, 26, 0.78);
        --card-edge: rgba(226, 250, 255, 0.2);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: grid;
        place-items: center;
        padding: 4px;
      }

      button {
        font: inherit;
      }

      .airy-card {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        width: 100%;
        height: 100%;
        min-width: 170px;
        min-height: 198px;
        padding: 4px 8px 9px;
        overflow: hidden;
        border: 1px solid var(--card-edge);
        border-radius: 16px;
        background:
          radial-gradient(circle at 50% 13%, rgba(122, 239, 255, 0.11), transparent 43%),
          linear-gradient(155deg, rgba(32, 46, 56, 0.82), var(--card) 54%, rgba(5, 11, 15, 0.9));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          inset 0 -1px 0 rgba(0, 0, 0, 0.5),
          0 4px 8px rgba(1, 8, 12, 0.35);
        isolation: isolate;
      }

      .airy-card::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.07), transparent 27% 73%, rgba(87, 239, 255, 0.04));
        content: "";
        pointer-events: none;
      }

      .pywebview-drag-region {
        -webkit-app-region: drag;
      }

      .no-drag {
        -webkit-app-region: no-drag;
      }

      .drag-handle {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 7;
        width: calc(100% - 44px);
        height: 28px;
        cursor: grab;
      }

      .airy-card.js-drag-fallback,
      .airy-card.js-drag-fallback .pywebview-drag-region {
        -webkit-app-region: no-drag;
        cursor: grab;
      }

      .airy-card.js-drag-fallback[data-dragging="true"] {
        cursor: grabbing;
      }

      .close-button {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 8;
        display: grid;
        width: 28px;
        height: 28px;
        padding: 0;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        color: rgba(226, 241, 246, 0.7);
        background: rgba(3, 10, 14, 0.44);
        cursor: pointer;
        transition: color 160ms ease, background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .close-button svg {
        width: 10px;
        height: 10px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 1.8;
      }

      .close-button:hover {
        border-color: rgba(255, 255, 255, 0.28);
        color: #ffffff;
        background: rgba(52, 68, 76, 0.72);
        transform: scale(1.06);
      }

      .close-button:active {
        transform: scale(0.94);
      }

      .close-button:focus-visible,
      .companion-button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      .companion-button {
        position: relative;
        display: grid;
        width: 100%;
        min-height: 0;
        padding: 5px 0 0;
        place-items: center;
        border: 0;
        border-radius: 12px;
        color: inherit;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .companion-button::after {
        position: absolute;
        inset: 12px 10px 2px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(87, 239, 255, 0.06), transparent 65%);
        content: "";
        opacity: 0;
        transition: opacity 240ms ease;
      }

      .companion-button:hover::after,
      .companion-button:focus-visible::after {
        opacity: 1;
      }

      .halo {
        position: absolute;
        top: 7px;
        left: 50%;
        width: 132px;
        height: 132px;
        border: 1px solid rgba(87, 239, 255, 0.4);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(87, 239, 255, 0.22) 0, rgba(87, 239, 255, 0.08) 38%, transparent 68%);
        box-shadow:
          0 0 17px rgba(87, 239, 255, 0.28),
          inset 0 0 22px rgba(87, 239, 255, 0.1);
        opacity: 0;
        transform: translateX(-50%) scale(0.82);
        transition: opacity 350ms ease, transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .airy-card[data-state="active"] .halo {
        opacity: 1;
        transform: translateX(-50%) scale(1);
        animation: halo-breathe 4.2s ease-in-out infinite;
      }

      .robot-svg {
        position: relative;
        z-index: 2;
        display: block;
        width: min(158px, 96%);
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 10px 10px rgba(0, 5, 8, 0.32));
      }

      .robot-sprite {
        transform-origin: 75px 74px;
      }

      .airy-card[data-state="active"] .robot-sprite {
        animation: airy-float 4.5s ease-in-out infinite;
      }

      .ground-shadow {
        fill: rgba(0, 5, 8, 0.42);
        transform-origin: 75px 123px;
        transition: opacity 260ms ease, transform 260ms ease;
      }

      .shell {
        fill: url(#shell-gradient);
        stroke: rgba(255, 255, 255, 0.72);
        stroke-width: 1.1;
        transition: filter 320ms ease, opacity 320ms ease;
      }

      .shell-shadow {
        fill: url(#shell-shadow-gradient);
        opacity: 0.74;
      }

      .shell-glint {
        fill: none;
        stroke: rgba(255, 255, 255, 0.8);
        stroke-linecap: round;
        stroke-width: 2.2;
        opacity: 0.74;
      }

      .face {
        fill: url(#face-gradient);
        stroke: rgba(180, 230, 241, 0.18);
        stroke-width: 1;
        transition: fill 280ms ease, stroke 280ms ease, opacity 280ms ease;
      }

      .face-sheen {
        fill: url(#face-sheen-gradient);
        opacity: 0.5;
      }

      .eye-core {
        fill: var(--cyan-white);
        stroke: rgba(255, 255, 255, 0.72);
        stroke-width: 0.5;
        filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px var(--cyan));
        transform-box: fill-box;
        transform-origin: center;
        transition: fill 260ms ease, stroke 260ms ease, transform 300ms ease, opacity 260ms ease, filter 260ms ease;
      }

      .eye-glint {
        fill: #ffffff;
        opacity: 0.88;
        transition: opacity 220ms ease;
      }

      .eye-lid {
        fill: none;
        stroke: #87979f;
        stroke-linecap: round;
        stroke-width: 2.2;
        opacity: 0;
        transition: opacity 240ms ease;
      }

      .core-light {
        fill: var(--cyan);
        filter: drop-shadow(0 0 4px rgba(87, 239, 255, 0.76));
        opacity: 0.82;
        transition: fill 260ms ease, opacity 260ms ease, filter 260ms ease;
      }

      .arm {
        transform-box: view-box;
        transform-origin: 111px 69px;
      }

      .airy-card[data-state="active"] .arm {
        animation: airy-wave 7.2s ease-in-out infinite;
      }

      .arm-link {
        fill: none;
        stroke: url(#arm-gradient);
        stroke-linecap: round;
        stroke-width: 12;
        transition: opacity 260ms ease, filter 260ms ease;
      }

      .arm-highlight {
        fill: none;
        stroke: rgba(255, 255, 255, 0.62);
        stroke-linecap: round;
        stroke-width: 2;
      }

      .hand {
        fill: url(#shell-gradient);
        stroke: rgba(255, 255, 255, 0.7);
        stroke-width: 1;
      }

      .signal-mote {
        fill: var(--cyan);
        filter: drop-shadow(0 0 4px var(--cyan));
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }

      .airy-card[data-state="active"] .signal-mote {
        opacity: 0.82;
        animation: mote-twinkle 3.8s ease-in-out infinite;
      }

      .airy-card[data-state="active"] .signal-mote:nth-of-type(2) {
        animation-delay: -1.4s;
      }

      .airy-card[data-state="active"] .signal-mote:nth-of-type(3) {
        animation-delay: -2.6s;
      }

      .airy-card[data-state="inactive"] .halo,
      .airy-card[data-state="offline"] .halo {
        opacity: 0;
      }

      .airy-card[data-state="inactive"] .eye-core {
        fill: #5a747b;
        stroke: transparent;
        filter: none;
        opacity: 0.64;
        transform: scaleY(0.15) scaleX(0.88);
      }

      .airy-card[data-state="inactive"] .eye-glint {
        opacity: 0;
      }

      .airy-card[data-state="inactive"] .eye-lid {
        opacity: 0.72;
      }

      .airy-card[data-state="inactive"] .face,
      .airy-card[data-state="inactive"] .arm-link,
      .airy-card[data-state="inactive"] .hand {
        opacity: 0.8;
      }

      .airy-card[data-state="inactive"] .core-light {
        fill: #61747a;
        filter: none;
        opacity: 0.46;
      }

      .airy-card[data-state="offline"] .robot-sprite {
        opacity: 0.66;
        filter: grayscale(1);
      }

      .airy-card[data-state="offline"] .shell {
        filter: brightness(0.74) saturate(0);
      }

      .airy-card[data-state="offline"] .face {
        fill: #121a1e;
        stroke: rgba(180, 193, 198, 0.18);
      }

      .airy-card[data-state="offline"] .eye-core {
        fill: transparent;
        stroke: #829198;
        stroke-width: 1.8;
        filter: none;
        opacity: 0.74;
      }

      .airy-card[data-state="offline"] .eye-glint,
      .airy-card[data-state="offline"] .eye-lid {
        opacity: 0;
      }

      .airy-card[data-state="offline"] .core-light {
        fill: transparent;
        stroke: #68777d;
        stroke-width: 1;
        filter: none;
        opacity: 0.56;
      }

      .airy-card[data-state="offline"] .ground-shadow {
        opacity: 0.58;
        transform: scaleX(0.88);
      }

      .status-pill {
        position: relative;
        z-index: 4;
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr);
        column-gap: 8px;
        align-items: center;
        min-height: 48px;
        padding: 7px 13px 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 17px;
        background: rgba(2, 9, 13, 0.58);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .state-dot {
        grid-row: 1 / span 2;
        width: 7px;
        height: 7px;
        border: 1px solid currentColor;
        border-radius: 50%;
        color: #74858d;
        background: transparent;
        transition: color 240ms ease, background 240ms ease, box-shadow 240ms ease;
      }

      .status-copy {
        min-width: 0;
      }

      .status-name {
        display: block;
        margin: 0;
        color: #dce8ec;
        font-size: 12px;
        font-weight: 720;
        letter-spacing: 0.025em;
        line-height: 1.2;
      }

      .status-detail {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        font-weight: 520;
        letter-spacing: 0.005em;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .airy-card[data-state="active"] .state-dot {
        color: var(--cyan);
        background: var(--cyan);
        box-shadow: 0 0 8px rgba(87, 239, 255, 0.9);
      }

      .airy-card[data-state="active"] .status-name {
        color: var(--cyan-white);
      }

      .airy-card[data-state="inactive"] .state-dot {
        color: #91a5ad;
        background: #91a5ad;
      }

      @keyframes airy-float {
        0%,
        100% {
          transform: translateY(1px) rotate(-0.35deg);
        }
        50% {
          transform: translateY(-4px) rotate(0.45deg);
        }
      }

      @keyframes halo-breathe {
        0%,
        100% {
          opacity: 0.72;
          transform: translateX(-50%) scale(0.96);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.035);
        }
      }

      @keyframes airy-wave {
        0%,
        68%,
        100% {
          transform: rotate(0deg);
        }
        72% {
          transform: rotate(-18deg);
        }
        76% {
          transform: rotate(11deg);
        }
        80% {
          transform: rotate(-15deg);
        }
        84% {
          transform: rotate(8deg);
        }
        88% {
          transform: rotate(0deg);
        }
      }

      @keyframes mote-twinkle {
        0%,
        100% {
          opacity: 0.18;
          transform: scale(0.58);
        }
        45% {
          opacity: 0.9;
          transform: scale(1.05);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main
      id="airy-card"
      class="airy-card pywebview-drag-region"
      data-state="offline"
      data-dragging="false"
      aria-label="Airy companion"
    >
      <span class="drag-handle pywebview-drag-region" aria-hidden="true"></span>
      <button id="close-button" class="close-button no-drag" type="button" aria-label="Hide Airy">
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.3 2.3 9.7 9.7M9.7 2.3 2.3 9.7" />
        </svg>
      </button>

      <button
        id="companion-button"
        class="companion-button no-drag"
        type="button"
        aria-label="Airy is offline. Toggle gesture tracking"
        aria-pressed="false"
      >
        <span class="halo" aria-hidden="true"></span>
        <svg class="robot-svg" viewBox="0 0 150 132" role="img" aria-labelledby="airy-title airy-description">
          <title id="airy-title">Airy, the AirControl companion</title>
          <desc id="airy-description">A small glossy robot with bright expressive eyes and a waving arm.</desc>
          <defs>
            <linearGradient id="shell-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.43" stop-color="#dce8eb" />
              <stop offset="0.72" stop-color="#a8bbc1" />
              <stop offset="1" stop-color="#67777e" />
            </linearGradient>
            <linearGradient id="shell-shadow-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd9dc" stop-opacity="0" />
              <stop offset="1" stop-color="#42535a" stop-opacity="0.82" />
            </linearGradient>
            <linearGradient id="face-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#182831" />
              <stop offset="0.52" stop-color="#081217" />
              <stop offset="1" stop-color="#02070a" />
            </linearGradient>
            <linearGradient id="face-sheen-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#b9f6ff" stop-opacity="0.22" />
              <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.035" />
              <stop offset="1" stop-color="#000000" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="arm-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e9f1f2" />
              <stop offset="0.55" stop-color="#a8babf" />
              <stop offset="1" stop-color="#687a81" />
            </linearGradient>
          </defs>

          <ellipse class="ground-shadow" cx="75" cy="122" rx="36" ry="5" />
          <g class="robot-sprite">
            <g class="arm">
              <path class="arm-link" d="M107 69c12 0 19-8 18-20" />
              <path class="arm-highlight" d="M110 66c8-1 12-7 12-15" />
              <path class="hand" d="M118 43c0-5 3-9 7-10 2-1 3 1 2 3l-1 4 4-5c1-2 4 0 3 2l-3 6 4-3c2-1 4 2 2 3l-7 6c-5 3-10-1-11-6Z" />
            </g>

            <rect class="shell" x="35" y="20" width="80" height="98" rx="38" />
            <path class="shell-shadow" d="M38 77c9 22 24 34 43 34 13 0 23-4 31-13-7 14-20 20-37 20-22 0-37-14-40-37Z" />
            <path class="shell-glint" d="M47 34c8-9 20-12 31-11" />

            <rect class="face" x="43" y="35" width="64" height="43" rx="21.5" />
            <path class="face-sheen" d="M47 53c2-10 10-15 21-15h19c8 0 14 3 17 9-17-5-36-2-57 6Z" />

            <ellipse class="eye-core" cx="62" cy="56" rx="7.4" ry="9.2" />
            <ellipse class="eye-core" cx="88" cy="56" rx="7.4" ry="9.2" />
            <ellipse class="eye-glint" cx="59.7" cy="52.4" rx="1.7" ry="2.3" />
            <ellipse class="eye-glint" cx="85.7" cy="52.4" rx="1.7" ry="2.3" />
            <path class="eye-lid" d="M55 57h14M81 57h14" />

            <rect x="58" y="88" width="34" height="16" rx="8" fill="#81949a" opacity="0.54" />
            <rect x="60" y="89" width="30" height="12" rx="6" fill="#26353b" opacity="0.9" />
            <circle class="core-light" cx="75" cy="95" r="3.3" />

            <circle class="signal-mote" cx="30" cy="45" r="1.5" />
            <circle class="signal-mote" cx="119" cy="22" r="1.2" />
            <circle class="signal-mote" cx="26" cy="82" r="1" />
          </g>
        </svg>
      </button>

      <section class="status-pill" role="status" aria-live="polite" aria-atomic="true">
        <span class="state-dot" aria-hidden="true"></span>
        <span class="status-copy">
          <strong id="status-name" class="status-name">Offline</strong>
          <span id="status-detail" class="status-detail">AirControl is not running</span>
        </span>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const DEFAULT_WS_URL = "ws://127.0.0.1:8787";
        const RECONNECT_BASE_MS = 500;
        const RECONNECT_MAX_MS = 8000;
        const params = new URLSearchParams(window.location.search);
        const card = document.getElementById("airy-card");
        const companionButton = document.getElementById("companion-button");
        const closeButton = document.getElementById("close-button");
        const statusName = document.getElementById("status-name");
        const statusDetail = document.getElementById("status-detail");

        const STATES = Object.freeze({
          active: Object.freeze({
            label: "Active",
            detail: "Tracking your gestures",
            buttonLabel: "Airy is active. Pause gesture tracking",
          }),
          inactive: Object.freeze({
            label: "Inactive",
            detail: "Gesture tracking paused",
            buttonLabel: "Airy is inactive. Arm gesture tracking",
          }),
          offline: Object.freeze({
            label: "Offline",
            detail: "AirControl is not running",
            buttonLabel: "Airy is offline. Toggle gesture tracking",
          }),
        });

        let socket = null;
        let connected = false;
        let armed = false;
        let reconnectAttempt = 0;
        let reconnectTimer = null;
        let shuttingDown = false;

        function loopbackWebSocketUrl() {
          const override = params.get("ws");
          if (!override) return DEFAULT_WS_URL;

          try {
            const candidate = new URL(override);
            const allowedHost = candidate.hostname === "127.0.0.1" || candidate.hostname === "localhost";
            if (candidate.protocol !== "ws:" || !allowedHost || candidate.username || candidate.password) {
              return DEFAULT_WS_URL;
            }
            return candidate.toString();
          } catch (_error) {
            return DEFAULT_WS_URL;
          }
        }

        function stateKey() {
          if (!connected) return "offline";
          return armed ? "active" : "inactive";
        }

        function render() {
          const key = stateKey();
          const state = STATES[key];
          card.dataset.state = key;
          statusName.textContent = state.label;
          statusDetail.textContent = state.detail;
          companionButton.setAttribute("aria-label", state.buttonLabel);
          companionButton.setAttribute("aria-pressed", String(key === "active"));
        }

        function sendCommand(name) {
          if (!socket || socket.readyState !== WebSocket.OPEN) return false;
          socket.send(JSON.stringify({ v: 1, type: "command", name }));
          return true;
        }

        function scheduleReconnect() {
          if (shuttingDown || reconnectTimer !== null) return;
          const delay = Math.min(RECONNECT_MAX_MS, RECONNECT_BASE_MS * 2 ** reconnectAttempt);
          reconnectAttempt += 1;
          reconnectTimer = window.setTimeout(() => {
            reconnectTimer = null;
            connect();
          }, delay);
        }

        function connect() {
          if (shuttingDown) return;
          let nextSocket;
          try {
            nextSocket = new WebSocket(loopbackWebSocketUrl());
          } catch (_error) {
            connected = false;
            render();
            scheduleReconnect();
            return;
          }

          socket = nextSocket;
          nextSocket.addEventListener("open", () => {
            if (socket !== nextSocket) return;
            connected = true;
            armed = false;
            reconnectAttempt = 0;
            render();
            sendCommand("get_status");
          });

          nextSocket.addEventListener("message", (event) => {
            if (socket !== nextSocket || typeof event.data !== "string") return;
            try {
              const message = JSON.parse(event.data);
              if (message && message.v === 1 && message.type === "status" && typeof message.armed === "boolean") {
                connected = true;
                armed = message.armed;
                render();
              }
            } catch (_error) {
              // Ignore malformed or non-JSON daemon frames; connection truth is unchanged.
            }
          });

          nextSocket.addEventListener("close", () => {
            if (socket !== nextSocket) return;
            socket = null;
            connected = false;
            armed = false;
            render();
            scheduleReconnect();
          });

          nextSocket.addEventListener("error", () => {
            if (socket === nextSocket) nextSocket.close();
          });
        }

        async function closeWidget() {
          try {
            if (window.pywebview && window.pywebview.api && window.pywebview.api.close_widget) {
              await window.pywebview.api.close_widget();
              return;
            }
          } catch (_error) {
            // Fall through to the browser close attempt if the native bridge failed.
          }
          window.close();
        }

        function installMoveFallback() {
          if (params.get("native_drag") !== "0") return;
          card.classList.add("js-drag-fallback");

          let drag = null;
          let queuedPosition = null;
          let animationFrame = null;

          const flushMove = () => {
            animationFrame = null;
            if (!queuedPosition) return;
            const api = window.pywebview && window.pywebview.api;
            if (api && api.move_window) {
              api.move_window(queuedPosition.x, queuedPosition.y);
            }
            queuedPosition = null;
          };

          card.addEventListener("pointerdown", (event) => {
            if (event.button !== 0 || event.target.closest(".no-drag")) return;
            drag = {
              pointerId: event.pointerId,
              pointerX: event.screenX,
              pointerY: event.screenY,
              windowX: window.screenX,
              windowY: window.screenY,
            };
            card.dataset.dragging = "true";
            card.setPointerCapture(event.pointerId);
            event.preventDefault();
          });

          card.addEventListener("pointermove", (event) => {
            if (!drag || event.pointerId !== drag.pointerId) return;
            queuedPosition = {
              x: Math.round(drag.windowX + event.screenX - drag.pointerX),
              y: Math.round(drag.windowY + event.screenY - drag.pointerY),
            };
            if (animationFrame === null) animationFrame = window.requestAnimationFrame(flushMove);
          });

          const finishDrag = (event) => {
            if (!drag || event.pointerId !== drag.pointerId) return;
            drag = null;
            card.dataset.dragging = "false";
            if (card.hasPointerCapture(event.pointerId)) card.releasePointerCapture(event.pointerId);
          };

          card.addEventListener("pointerup", finishDrag);
          card.addEventListener("pointercancel", finishDrag);
        }

        companionButton.addEventListener("click", () => sendCommand("toggle_arm"));
        closeButton.addEventListener("click", closeWidget);

        window.addEventListener("beforeunload", () => {
          shuttingDown = true;
          if (reconnectTimer !== null) window.clearTimeout(reconnectTimer);
          if (socket) socket.close();
        });

        render();
        installMoveFallback();
        connect();
      })();
    </script>
  </body>
</html>
